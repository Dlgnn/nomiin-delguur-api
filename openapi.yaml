openapi: 3.0.0
info:
  title: Book Store API
  version: 1.0.0
  description: Номын дэлгүүрийн Backend API documentation
servers:
  - url: http://localhost:3000
    description: Local development server
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Уран зохиол
        createdAt:
          type: string
          format: date-time
    Brand:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Монсудар
        country:
          type: string
          nullable: true
          example: Монгол
        createdAt:
          type: string
          format: date-time
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Цагаан бороо
        isbn:
          type: string
          example: "9789919000002"
        price:
          type: number
          example: 18000
        stock:
          type: integer
          example: 15
        publishedYear:
          type: integer
          example: 2020
        pages:
          type: integer
          example: 210
        description:
          type: string
          nullable: true
          example: Номын тайлбар.
        isAvailable:
          type: boolean
          example: true
        categoryId:
          type: integer
          example: 1
        brandId:
          type: integer
          nullable: true
          example: 1
        createdAt:
          type: string
          format: date-time
        averageRating:
          type: number
          nullable: true
          example: 4.5
          description: Бүтээгдэхүүний дундаж үнэлгээ. Үнэлгээ байхгүй бол null.
        reviewCount:
          type: integer
          example: 10
          description: Нийт үнэлгээний тоо.
    ProductInput:
      type: object
      required:
        - title
        - isbn
        - price
        - stock
        - publishedYear
        - pages
        - categoryId
      properties:
        title:
          type: string
          example: Цагаан бороо
        isbn:
          type: string
          example: "9789919000002"
        price:
          type: number
          example: 18000
        stock:
          type: integer
          example: 15
        publishedYear:
          type: integer
          example: 2020
        pages:
          type: integer
          example: 210
        description:
          type: string
          nullable: true
          example: Номын тайлбар.
        isAvailable:
          type: boolean
          example: true
        categoryId:
          type: integer
          example: 1
        brandId:
          type: integer
          nullable: true
          example: 1
    Review:
      type: object
      required:
        - rating
        - authorName
        - productId
      properties:
        id:
          type: integer
          example: 1
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: Сонирхолтой ном байна.
        authorName:
          type: string
          example: Бат
        productId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        message:
          type: string
          example: Record not found.
        field:
          type: string
          example: name
paths:
  /reviews:
    get:
      summary: Бүх сэтгэгдэл авах
      tags:
        - Reviews
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Хуудасны дугаар
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Нэг хуудсанд харагдах сэтгэгдлийн тоо
      responses:
        "200":
          description: Сэтгэгдлүүд амжилттай буцлаа.
        "400":
          description: Page эсвэл limit параметр буруу.
    post:
      summary: Шинэ сэтгэгдэл бүртгэх
      tags:
        - Reviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
                - authorName
                - productId
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  nullable: true
                  example: Маш сонирхолтой ном байна.
                authorName:
                  type: string
                  example: Бат
                productId:
                  type: integer
                  example: 1
      responses:
        "201":
          description: Сэтгэгдэл амжилттай үүссэн.
        "400":
          description: Оролтын өгөгдөл буруу.
        "404":
          description: Product олдсонгүй.
        "409":
          description: Давхардсан сэтгэгдэл.
  /reviews/{id}:
    get:
      summary: ID-аар сэтгэгдэл авах
      tags:
        - Reviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Сэтгэгдлийн ID
      responses:
        "200":
          description: Сэтгэгдэл амжилттай олдсон.
        "400":
          description: ID буруу байна.
        "404":
          description: Сэтгэгдэл олдсонгүй.
    patch:
      summary: Сэтгэгдэл шинэчлэх
      tags:
        - Reviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Сэтгэгдлийн ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 4
                comment:
                  type: string
                  nullable: true
                  example: Сэтгэгдлээ шинэчиллээ.
                authorName:
                  type: string
                  example: Бат
      responses:
        "200":
          description: Сэтгэгдэл амжилттай шинэчлэгдсэн.
        "400":
          description: Оролтын өгөгдөл буруу.
        "404":
          description: Сэтгэгдэл олдсонгүй.
        "409":
          description: Давхардсан сэтгэгдэл.
    delete:
      summary: Сэтгэгдэл устгах
      tags:
        - Reviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Сэтгэгдлийн ID
      responses:
        "204":
          description: Сэтгэгдэл амжилттай устсан.
        "400":
          description: ID буруу байна.
        "404":
          description: Сэтгэгдэл олдсонгүй.
  /products:
    get:
      summary: Get all products
      description: Номын жагсаалтыг хайлт, шүүлт, эрэмбэлэлт болон хуудаслалттай буцаана.
      tags:
        - Products
      parameters:
        - in: query
          name: minRating
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 5
          description: Дундаж үнэлгээ нь энэ утгаас багагүй бүтээгдэхүүнүүдийг шүүнэ.
          example: 4
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Нэг хуудсанд авах номын тоо
          example: 4
        - in: query
          name: search
          schema:
            type: string
          description: Номын нэрээр хайх
        - in: query
          name: categoryId
          schema:
            type: integer
            minimum: 1
          description: Ангиллын ID-аар шүүх
        - in: query
          name: brandId
          schema:
            type: integer
            minimum: 1
          description: Брэндийн ID-аар шүүх
        - in: query
          name: minPrice
          schema:
            type: number
            minimum: 0
          description: Үнийн доод хязгаар
        - in: query
          name: maxPrice
          schema:
            type: number
            minimum: 0
          description: Үнийн дээд хязгаар
        - in: query
          name: isAvailable
          schema:
            type: boolean
          description: Ном байгаа эсэхээр шүүх
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - id
              - title
              - price
              - publishedYear
              - createdAt
            default: id
          description: Эрэмбэлэх талбар
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: Өсөх эсвэл буурах дараалал
      responses:
        "200":
          description: Номын жагсаалт амжилттай буцлаа.
        "400":
          description: Query параметрүүд буруу байна.
    post:
      summary: Create a product
      description: Шинэ ном бүртгэнэ.
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Ном амжилттай үүссэн.
        "400":
          description: Оролтын өгөгдөл буруу эсвэл шаардлагатай талбар дутуу.
        "404":
          description: Category эсвэл Brand олдсонгүй.
        "409":
          description: ISBN давхардсан.
  /products/{id}:
    get:
      summary: Get product by ID
      description: ID-аар нэг номын дэлгэрэнгүй мэдээлэл авна.
      tags:
        - Products
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Номын ID
      responses:
        "200":
          description: Номын мэдээлэл амжилттай буцлаа.
        "400":
          description: ID буруу байна.
        "404":
          description: Ном олдсонгүй.
    patch:
      summary: Update product
      description: Номын мэдээллийг хэсэгчлэн шинэчилнэ.
      tags:
        - Products
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Номын ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Backend хөгжүүлэлтийн үндэс
                isbn:
                  type: string
                  example: "9789919000001"
                price:
                  type: number
                  example: 45000
                stock:
                  type: integer
                  example: 10
                publishedYear:
                  type: integer
                  example: 2025
                pages:
                  type: integer
                  example: 320
                description:
                  type: string
                  nullable: true
                isAvailable:
                  type: boolean
                  example: true
                categoryId:
                  type: integer
                  example: 1
                brandId:
                  type: integer
                  nullable: true
                  example: 1
      responses:
        "200":
          description: Ном амжилттай шинэчлэгдсэн.
        "400":
          description: ID эсвэл request body буруу байна.
        "404":
          description: Ном, Category эсвэл Brand олдсонгүй.
        "409":
          description: ISBN давхардсан.
    delete:
      summary: Delete product
      description: Номыг устгана. Түүнтэй холбоотой Review-үүд мөн устгагдана.
      tags:
        - Products
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: Номын ID
      responses:
        "204":
          description: Ном амжилттай устгагдсан.
        "400":
          description: ID буруу байна.
        "404":
          description: Ном олдсонгүй.
  /categories:
    get:
      summary: Get all categories
      description: Ангиллуудын жагсаалтыг хуудаслалттай буцаана.
      tags:
        - Categories
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Хуудасны дугаар
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
          description: Нэг хуудсанд авах ангиллын тоо
      responses:
        "200":
          description: Ангиллын жагсаалт амжилттай буцлаа.
        "400":
          description: Page эсвэл limit буруу байна.
    post:
      summary: Create a category
      description: Шинэ ангилал үүсгэнэ.
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Программчлал
      responses:
        "201":
          description: Ангилал амжилттай үүссэн.
        "400":
          description: Оролтын өгөгдөл буруу эсвэл шаардлагатай талбар дутуу.
        "409":
          description: Ижил нэртэй ангилал бүртгэлтэй байна.
  /categories/{id}:
    get:
      summary: Get category by ID
      description: ID-аар нэг ангиллын мэдээллийг авна.
      tags:
        - Categories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ангиллын ID
      responses:
        "200":
          description: Ангиллын мэдээлэл амжилттай буцлаа.
        "400":
          description: ID буруу байна.
        "404":
          description: Ангилал олдсонгүй.
    patch:
      summary: Update category
      description: Ангиллын нэрийг хэсэгчлэн шинэчилнэ.
      tags:
        - Categories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ангиллын ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Программчлалын ном
      responses:
        "200":
          description: Ангилал амжилттай шинэчлэгдсэн.
        "400":
          description: ID эсвэл request body буруу байна.
        "404":
          description: Ангилал олдсонгүй.
        "409":
          description: Ижил нэртэй ангилал байна.
    delete:
      summary: Delete category
      description: Бүтээгдэхүүнтэй холбоогүй ангиллыг устгана.
      tags:
        - Categories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ангиллын ID
      responses:
        "204":
          description: Ангилал амжилттай устгагдсан.
        "400":
          description: ID буруу байна.
        "404":
          description: Ангилал олдсонгүй.
        "409":
          description: Энэ ангилалд бүтээгдэхүүн байгаа тул устгах боломжгүй.
  /brands:
    get:
      summary: Get all brands
      description: Брэндүүдийн жагсаалтыг хуудаслалттай буцаана.
      tags:
        - Brands
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Хуудасны дугаар
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
          description: Нэг хуудсанд авах брэндийн тоо
      responses:
        "200":
          description: Брэндүүдийн жагсаалт амжилттай буцлаа.
        "400":
          description: Page эсвэл limit буруу байна.
    post:
      summary: Create a brand
      description: Шинэ брэнд үүсгэнэ.
      tags:
        - Brands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Монсудар
                country:
                  type: string
                  nullable: true
                  example: Монгол
      responses:
        "201":
          description: Брэнд амжилттай үүссэн.
        "400":
          description: Оролтын өгөгдөл буруу эсвэл шаардлагатай талбар дутуу.
        "409":
          description: Ижил нэртэй брэнд бүртгэлтэй байна.
  /brands/{id}:
    get:
      summary: Get brand by ID
      description: ID-аар нэг брэндийн мэдээллийг авна.
      tags:
        - Brands
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Брэндийн ID
      responses:
        "200":
          description: Брэндийн мэдээлэл амжилттай буцлаа.
        "400":
          description: ID буруу байна.
        "404":
          description: Брэнд олдсонгүй.
    patch:
      summary: Update brand
      description: Брэндийн мэдээллийг хэсэгчлэн шинэчилнэ.
      tags:
        - Brands
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Брэндийн ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Монсудар хэвлэл
                country:
                  type: string
                  nullable: true
                  example: Монгол
      responses:
        "200":
          description: Брэнд амжилттай шинэчлэгдсэн.
        "400":
          description: ID эсвэл request body буруу байна.
        "404":
          description: Брэнд олдсонгүй.
        "409":
          description: Ижил нэртэй брэнд байна.
    delete:
      summary: Delete brand
      description: Брэндийг устгана. Түүнтэй холбоотой Product-ийн brandId null болно.
      tags:
        - Brands
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Брэндийн ID
      responses:
        "204":
          description: Брэнд амжилттай устгагдсан.
        "400":
          description: ID буруу байна.
        "404":
          description: Брэнд олдсонгүй.
  /health:
    get:
      summary: Серверийн ажиллагаа шалгах
      tags:
        - Health
      responses:
        "200":
          description: Сервер хэвийн ажиллаж байна.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
tags: []
